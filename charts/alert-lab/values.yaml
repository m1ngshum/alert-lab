replicaCount: 1
image:
  repository: ghcr.io/m1ngshum/alert-lab
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
credentials:
  existingSecret: ""
  tokenKey: service-token
prometheusCredentials:
  existingSecret: ""
  tokenKey: token
persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
config:
  selector:
    alertname: AlertLabSpike
  prometheus:
    url: http://prometheus:9090
    queries: {}
