name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '26.13.0', package-manager-cache: false}
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p "*_test.py"
      - run: npm run build:demo
      - run: npm audit --audit-level=high
      - run: python3 scripts/install-tools.py helm kind trivy gitleaks
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: node scripts/chart-check.mjs
      - run: gitleaks dir . --redact --no-banner
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: alert-lab:local
          provenance: false
          sbom: false
          cache-from: type=gha,scope=node-source-${{ matrix.architecture }}
          cache-to: type=gha,scope=node-source-${{ matrix.architecture }},mode=max
      - run: python3 scripts/image-check.py alert-lab:local
      - run: python3 scripts/install-tools.py trivy
      - run: |
          .tools/trivy image --scanners vuln,secret --list-all-pkgs --format json --output scan.json alert-lab:local
          python3 scripts/security-report.py scan.json "${{ matrix.architecture }}" "$(docker image inspect alert-lab:local --format '{{.Id}}')" security.md
      - if: matrix.architecture == 'amd64'
        run: |
          python3 scripts/install-tools.py helm kind
          PATH="$PWD/.tools:$PATH" python3 scripts/kind-test.py
  verify:
    needs: [checks, runtime]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: test "$CHECKS" = success && test "$RUNTIME" = success
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: {languages: javascript-typescript, build-mode: none}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
