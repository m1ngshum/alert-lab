name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '26.13.0', package-manager-cache: false}
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - run: npm audit --audit-level=high
      - run: python3 scripts/install-tools.py helm kind trivy gitleaks
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: node scripts/chart-check.mjs
      - run: gitleaks dir . --redact --no-banner
      - run: docker build -t alert-lab:local .
      - run: trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 alert-lab:local
      - run: python3 scripts/kind-test.py
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: {languages: javascript-typescript, build-mode: none}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
